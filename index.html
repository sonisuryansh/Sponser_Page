<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/medhaarc_metallic_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedhaArc Labs — School Technology Learning Initiative</title>
    <script>
      // Force scroll to top (Section 1) on refresh, preventing automatic scroll restoration
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>
    <meta name="description" content="A school-focused technology learning initiative connecting Robotics & Automation, AI/ML, Data Analytics, and Aerial Systems." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #page-preloader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0A0D10;
        z-index: 9999999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
        pointer-events: all;
      }
      #page-preloader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .simple-circle-loader {
        width: 40px;
        height: 40px;
        border: 2.5px solid rgba(255, 255, 255, 0.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: simple-circle-spin 0.75s linear infinite;
      }
      @keyframes simple-circle-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#DFE6E7] text-[#203744] antialiased selection:bg-[#398BB0] selection:text-white">
    <!-- Initial Simple Circle Loader (Only circle, no text/graphics) -->
    <div id="page-preloader">
      <div class="simple-circle-loader" aria-label="Loading"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var p = document.getElementById('page-preloader');
          if (p && !p.classList.contains('loaded')) {
            p.classList.add('loaded');
            setTimeout(function() { p.style.display = 'none'; }, 450);
          }
        }, 1200);
      });
    </script>
  </body>
</html>
